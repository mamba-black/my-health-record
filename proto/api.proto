syntax = "proto3";
package grpc;

// ============================================================================
// SERVICIOS (SERVICES)
// ============================================================================

/// Servicio de gestión y búsqueda de pacientes en el contexto clínico.
/// Basado en el recurso Patient de HL7 FHIR R4.
service PatientApi {
    /// Búsqueda de pacientes por criterio (nombre, apellido, email).
    rpc SearchPatient (SearchPatientRequest) returns (SearchPatientResponse) {}

    /// Obtiene un paciente por su identificador único (UUID v7).
    rpc GetPatientById (PatientIdRequest) returns (Patient) {}

    /// Crea o actualiza un registro de paciente.
    rpc Save (Patient) returns (Patient) {}
}

/// Servicio de gestión de usuarios, autenticación y registro inicial.
service UserApi {
    /// Registro de un nuevo usuario en la plataforma (Perfilado Progresivo).
    rpc SignUp (SignUpRequest) returns (SignUpResponse) {}

    /// Inicio de sesión de un usuario registrado utilizando token de ID.
    rpc SignIn (SignInRequest) returns (SignInResponse) {}
}


// ============================================================================
// MENSAJES DE SOLICITUD Y RESPUESTA DE PACIENTE Y USUARIOS
// ============================================================================

/// Solicitud de búsqueda de pacientes.
message SearchPatientRequest {
    optional string name = 1; // Filtro de búsqueda por nombre o coincidencia parcial
}

/// Solicitud de consulta por ID de paciente.
message PatientIdRequest {
    optional string id = 1; // UUID v7 del paciente
}

/// Respuesta estructurada a la búsqueda de pacientes.
message SearchPatientResponse {
    optional string first_name = 1;
    optional string last_name = 2;
    optional string second_last_name = 3;
    optional string email = 4;
    repeated Patient patients = 5; // Lista de pacientes coincidentes
}

/// Representa una identificación oficial o nacional (FHIR Identifier).
message Identifier {
    oneof identifier_type {
        string dni = 1; // Documento Nacional de Identidad
    }
}

/// Solicitud de registro inicial de usuario (Sign Up).
/// Implementa la estrategia de perfilado progresivo.
message SignUpRequest {
    string id_token = 1;                     // Token JWT del proveedor de identidad
    string user_id = 2;                      // UUID v7 asignado al usuario
    string provider_id = 3;                  // Identificador del proveedor (ej. "google.com")
    string provider_name = 4;                // Nombre legible del proveedor (ej. "Google")
    optional string provider_avatar_url = 5; // URL de la fotografía entregada por el proveedor

    string email = 6;                        // Correo electrónico principal
    optional Identifier identifier = 7;      // Documento de identidad opcional en registro inicial
    string given_name = 9;                   // Nombres de pila (FHIR: HumanName.given)
    string family_name = 10;                 // Primer apellido (FHIR: HumanName.family)
    optional string second_family_name = 11; // Segundo apellido (Extensión hispana)
    string phone = 12;                       // Teléfono de contacto
    string address = 13;                     // Dirección domiciliaria
    string birth_date = 14;                  // Fecha de nacimiento (Formato YYYY-MM-DD)
    optional string display_name = 15;       // Nombre de visualización personalizado
    bool create_clinic = 16;                 // Indica si se debe inicializar una clínica para el usuario
}

/// Estado del resultado del registro de usuario.
enum SignUpStatus {
    SIGN_UP_STATUS_UNSPECIFIED = 0;
    /// Registro completado y verificado exitosamente.
    SUCCESS = 1;
    /// Registro completado. Se detectó un historial previo con el DNI; la vinculación quedó en estado pendiente de verificación presencial.
    LINK_PENDING_PRESENCIAL_VERIFICATION = 2;
}

/// Respuesta al registro de usuario.
message SignUpResponse {
    SignUpStatus status = 1;      // Estado contextual de la operación de registro
    string message = 2;            // Mensaje legible para la interfaz de usuario (UI)
    optional string user_id = 3;   // UUID v7 de la cuenta de usuario creada
    optional PersonLink link = 4;  // Enlace generado con su nivel de certeza (AssuranceLevel)
}

/// Solicitud de autenticación de usuario (Sign In).
message SignInRequest {
    string id_token = 1;     // Token JWT del proveedor de identidad
    string provider_id = 2;  // Identificador del proveedor de autenticación
}

/// Respuesta a la autenticación de usuario.
message SignInResponse {}


// ============================================================================
// TIPOS DE DATOS CLAVE (DATA TYPES - HL7 FHIR R4)
// ============================================================================

/// Representa el nombre de una persona según la especificación HL7 FHIR R4.
/// Ref: https://hl7.org/fhir/R4/datatypes.html#HumanName
message HumanName {
    string use = 1;             // Propósito del nombre (ej. "official", "usual")
    repeated string family = 2; // Apellidos (family names)
    repeated string given = 3;  // Nombres de pila (given names)
}

/// Representa un punto de contacto (teléfono, email, etc.) según HL7 FHIR R4.
/// Ref: https://hl7.org/fhir/R4/datatypes.html#ContactPoint
message ContactPoint {
    /// Sistema de telecomunicación utilizado
    enum System {
        SYSTEM_UNSPECIFIED = 0;
        PHONE = 1;
        FAX = 2;
        EMAIL = 3;
        SMS = 4;
        URL = 5;
    }

    /// Contexto o propósito del contacto
    enum Use {
        USE_UNSPECIFIED = 0;
        HOME = 1;
        WORK = 2;
        MOBILE = 3;
        TEMP = 4;
        OLD = 5;
    }

    System system = 1; // Canal de contacto
    string value = 2;  // Valor del contacto (ej. "usuario@dominio.com" o "+51999888777")
    Use use = 3;       // Contexto de uso
}

/// Representa un archivo adjunto o medio multimedia según HL7 FHIR R4.
/// Ref: https://hl7.org/fhir/R4/datatypes.html#Attachment
message Attachment {
    string content_type = 1; // Tipo MIME (ej. "image/jpeg", "image/png")
    string url = 2;          // URL accesible del recurso
    bytes data = 3;          // Contenido binario directo (opcional)
    string title = 4;        // Título o descripción del recurso
    string creation = 5;     // Fecha de creación (Formato ISO-8601)
}


// ============================================================================
// RECURSOS PRINCIPALES (FHIR RESOURCES: PERSON & PATIENT)
// ============================================================================

/// Representa una vinculación FHIR (Person.link) entre la identidad de la persona
/// y recursos de pacientes, profesionales de salud u organizaciones.
/// Ref: https://hl7.org/fhir/R4/person-definitions.html#Person.link
message PersonLink {
    /// Nivel de certeza o verificación de la vinculación (FHIR: Person.link.assurance)
    enum AssuranceLevel {
        ASSURANCE_UNSPECIFIED = 0;
        LEVEL_1 = 1; // Certeza muy baja (declarativa)
        LEVEL_2 = 2; // Certeza baja
        LEVEL_3 = 3; // Certeza alta (verificada)
        LEVEL_4 = 4; // Certeza oficial / absoluta (documentada y verificada)
    }

    /// Recurso de destino al que se enlaza esta identidad
    oneof target {
        string patient_id = 1;        // ID del recurso Patient vinculado (propio o familiar)
        string practitioner_id = 2;   // ID del recurso Practitioner (médico / profesional)
        string related_person_id = 3; // ID del recurso RelatedPerson (tutor / familiar)
        string organization_id = 4;   // ID del recurso Organization (clínica)
    }

    AssuranceLevel assurance = 5;     // Nivel de certeza del enlace
}

/// Recurso Persona (Identidad de Usuario) según la especificación HL7 FHIR R4.
/// Ref: https://hl7.org/fhir/R4/person.html
message Person {
    string id = 1;                      // UUID v7 de la persona / usuario
    bool active = 2;                    // Estado activo/inactivo de la cuenta
    repeated Identifier identifier = 3; // Documentos oficiales (ej. DNI)
    repeated HumanName name = 4;        // Nombres de la persona
    repeated ContactPoint telecom = 5;  // Vías de contacto (email, teléfono)
    
    enum Gender {
        GENDER_UNSPECIFIED = 0;
        MALE = 1;
        FEMALE = 2;
        OTHER = 3;
        UNKNOWN = 4;
    }
    Gender gender = 6;                  // Género administrativo
    string birth_date = 7;             // Fecha de nacimiento (Formato YYYY-MM-DD)
    repeated Attachment photo = 8;      // Fotografía o avatar de la persona
    repeated PersonLink link = 9;       // Lista de enlaces a recursos Patient, Practitioner, etc.
}

/// Recurso Paciente según la especificación HL7 FHIR R4.
/// Ref: https://hl7.org/fhir/R4/patient.html
message Patient {
    string id = 1;                      // UUID v7 único del paciente

    // 1. Identificación y Estado
    repeated Identifier identifier = 2; // Documentos e identificadores asociados
    bool active = 3;                    // Estado activo/inactivo del registro del paciente

    // 2. Datos Demográficos
    repeated HumanName name = 4;        // Nombres del paciente (legal, usual, etc.)
    repeated ContactPoint telecom = 5;  // Vías de contacto (teléfono, email)

    /// Género administrativo según FHIR
    enum Gender {
        GENDER_UNSPECIFIED = 0;
        MALE = 1;
        FEMALE = 2;
        OTHER = 3;
        UNKNOWN = 4;
    }

    Gender gender = 6;                  // Género del paciente
    string birth_date = 7;             // Fecha de nacimiento (Formato YYYY-MM-DD)

    // 3. Estado de fallecimiento
    oneof deceased_status {
        bool is_deceased_boolean = 8;   // Indica si el paciente ha fallecido
        string deceased_date_time = 9;  // Fecha y hora del fallecimiento (ISO-8601)
    }

    // 4. Organización y Custodia
    string managing_organization_reference = 10; // Referencia a la clínica u organización custodia

    // 5. Fotografía o Imagen de Perfil
    repeated Attachment photo = 11;     // Fotografía o avatar del paciente
}

