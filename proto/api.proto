syntax = "proto3";
package grpc;

// ============================================================================
// SERVICIOS (SERVICES)
// ============================================================================

/// Servicio de gestión y búsqueda de pacientes en el contexto clínico.
/// Basado en el recurso Patient de HL7 FHIR R4.
service PatientApi {
    /// Búsqueda de pacientes por criterio (nombre, apellido, email).
    rpc SearchPatient (SearchPatientRequest) returns (SearchPatientResponse) {}

    /// Obtiene un paciente por su identificador único (UUID v7).
    rpc GetPatientById (PatientIdRequest) returns (Patient) {}

    /// Crea o actualiza un registro de paciente.
    rpc Save (Patient) returns (Patient) {}

    /// Recepción (dueño, administrador o recepcionista) registra en su clínica a un
    /// paciente sin cuenta. Rechaza un documento ya registrado en la clínica.
    rpc RegisterPatient (RegisterPatientRequest) returns (Patient) {}
}

/// Servicio de gestión de usuarios, autenticación y registro inicial.
service UserApi {
    /// Registro de un nuevo usuario en la plataforma (Perfilado Progresivo).
    rpc SignUp (SignUpRequest) returns (SignUpResponse) {}

    /// Inicio de sesión de un usuario registrado utilizando token de ID.
    rpc SignIn (SignInRequest) returns (SignInResponse) {}

    /// Guarda datos del perfil de la cuenta de la sesión. Un dato omitido conserva su valor.
    rpc CompleteProfile (CompleteProfileRequest) returns (SignInResponse) {}

    /// Renueva la sesión con el token de renovación. No requiere token de acceso.
    rpc RefreshSession (RefreshSessionRequest) returns (SessionTokens) {}

    /// Datos que aplican a los roles del usuario de la sesión, para qué acción es
    /// obligatorio cada uno y cuáles faltan, junto con sus membresías.
    rpc GetProfileRequirements (GetProfileRequirementsRequest) returns (ProfileRequirements) {}
}

/// Servicio de gestión de clínicas (FHIR R4 Organization).
service ClinicApi {
    /// Crea una clínica y deja a quien la solicita como su propietario.
    ///
    /// Es una operación independiente del registro: un usuario ya existente puede
    /// crear una clínica, y puede crear más de una.
    rpc CreateClinic (CreateClinicRequest) returns (CreateClinicResponse) {}

    /// Guarda los datos legales de la clínica mientras está pendiente de activación.
    rpc UpdateClinicSetup (UpdateClinicSetupRequest) returns (ClinicSummary) {}

    /// Activa la clínica. Exige los datos del dueño y los datos legales de la clínica.
    rpc ActivateClinic (ClinicIdRequest) returns (ClinicSummary) {}

    /// Invita a un usuario registrado (por su correo) a la clínica con un rol.
    rpc InviteMember (InviteMemberRequest) returns (Membership) {}

    /// El invitado acepta la invitación y se une a la clínica.
    rpc JoinClinic (MembershipIdRequest) returns (Membership) {}

    /// El médico activa su perfil en la clínica. Exige sus datos y su colegiatura.
    rpc ActivatePractitioner (MembershipIdRequest) returns (Membership) {}

    /// Un dueño o administrador confirma la colegiatura de un médico de su clínica.
    rpc ConfirmLicense (MembershipIdRequest) returns (Membership) {}

    /// Un dueño o administrador suspende una membresía de su clínica. También sirve
    /// para rechazar una solicitud de ingreso.
    rpc SuspendMembership (MembershipIdRequest) returns (Membership) {}

    /// Quien no pertenece a la clínica pide entrar como médico o recepcionista, con el
    /// enlace (subdominio) de una clínica activa de su red. Queda como solicitud.
    rpc RequestMembership (RequestMembershipRequest) returns (Membership) {}

    /// Un dueño o administrador aprueba una solicitud de ingreso.
    rpc ApproveMembership (MembershipIdRequest) returns (Membership) {}

    /// Personal de la clínica (miembros, invitaciones y solicitudes) para el dueño o un
    /// administrador.
    rpc ListClinicMembers (ClinicIdRequest) returns (ClinicMembers) {}
}


/// Agenda pública de una clínica activa: no exige sesión. Las fechas son RFC 3339 en UTC.
service PublicSchedulingApi {
    /// Clínica por su enlace (subdominio), en cualquier estado.
    rpc GetClinic (ClinicLinkRequest) returns (PublicClinic) {}

    /// Médicos activos con horario. Una clínica pendiente o suspendida no muestra a nadie.
    rpc ListPractitioners (ClinicLinkRequest) returns (PublicPractitioners) {}

    /// Cupos libres de un médico: futuros y dentro de la ventana de reserva.
    rpc GetAvailability (AvailabilityRequest) returns (Availability) {}
}

/// Agenda y citas con sesión. Las fechas son RFC 3339 en UTC; las horas del horario,
/// `HH:MM` locales de la clínica.
service SchedulingApi {
    /// El médico guarda su horario semanal en la clínica.
    rpc SetWeeklySchedule (SetWeeklyScheduleRequest) returns (ScheduleResponse) {}
    /// Horario y excepciones del médico de la sesión en la clínica.
    rpc GetSchedule (ClinicIdRequest) returns (ScheduleResponse) {}
    rpc AddScheduleException (AddScheduleExceptionRequest) returns (ScheduleResponse) {}
    rpc RemoveScheduleException (RemoveScheduleExceptionRequest) returns (ScheduleResponse) {}

    /// El paciente reserva para sí mismo (exige sus datos: `ACTION_CONFIRM_APPOINTMENT`).
    rpc BookAppointment (BookAppointmentRequest) returns (AppointmentInfo) {}
    /// La clínica reserva en nombre de un paciente, aunque no tenga cuenta.
    rpc BookForPatient (BookForPatientRequest) returns (AppointmentInfo) {}

    /// Citas del paciente de la sesión en las clínicas de su organización.
    rpc ListMyAppointments (ListMyAppointmentsRequest) returns (AppointmentList) {}
    /// Agenda de la clínica (el médico ve solo la suya).
    rpc ListClinicAppointments (ListClinicAppointmentsRequest) returns (AppointmentList) {}

    rpc CancelAppointment (AppointmentIdRequest) returns (AppointmentInfo) {}
    rpc RescheduleAppointment (RescheduleAppointmentRequest) returns (AppointmentInfo) {}

    /// Recepción registra la llegada y, opcionalmente, la verificación del documento.
    rpc CheckIn (CheckInRequest) returns (CheckInResponse) {}
    rpc MarkNoShow (AppointmentIdRequest) returns (AppointmentInfo) {}

    /// Cuentas con el mismo documento que un paciente registrado sin cuenta.
    rpc SuggestPatientLinks (PatientLinkRequest) returns (LinkSuggestions) {}
    /// Vincula, con el documento físico a la vista, un paciente sin cuenta con su cuenta.
    rpc LinkPatientAccount (LinkPatientAccountRequest) returns (PatientLinkResponse) {}
    /// El dueño deshace un vínculo equivocado, con su motivo.
    rpc UnlinkPatientAccount (UnlinkPatientAccountRequest) returns (PatientLinkResponse) {}
}

// ============================================================================
// MENSAJES DE SOLICITUD Y RESPUESTA DE PACIENTE Y USUARIOS
// ============================================================================

/// Paciente que recepción registra sin cuenta.
message RegisterPatientRequest {
    string given_name = 1;
    string family_name = 2;
    optional string second_family_name = 3;
    Identifier identifier = 4;
    string phone = 5;
    optional string birth_date = 6; // YYYY-MM-DD
}

/// Solicitud de búsqueda de pacientes.
message SearchPatientRequest {
    optional string name = 1; // Filtro de búsqueda por nombre o coincidencia parcial
}

/// Solicitud de consulta por ID de paciente.
message PatientIdRequest {
    optional string id = 1; // UUID v7 del paciente
}

/// Respuesta estructurada a la búsqueda de pacientes.
message SearchPatientResponse {
    optional string first_name = 1;
    optional string last_name = 2;
    optional string second_last_name = 3;
    optional string email = 4;
    repeated Patient patients = 5; // Lista de pacientes coincidentes
}

/// Representa una identificación oficial o nacional (FHIR Identifier).
message Identifier {
    oneof identifier_type {
        string dni = 1;        // Documento Nacional de Identidad (8 dígitos)
        string ce = 2;         // Carné de extranjería
        string passport = 3;   // Pasaporte
    }
}

/// Solicitud de registro inicial de usuario (Sign Up).
/// Implementa la estrategia de perfilado progresivo.
message SignUpRequest {
    string id_token = 1;                     // Token JWT del proveedor de identidad
    string user_id = 2;                      // UUID v7 asignado al usuario
    string provider_id = 3;                  // Identificador del proveedor (ej. "google.com")
    string provider_name = 4;                // Nombre legible del proveedor (ej. "Google")
    optional string provider_avatar_url = 5; // URL de la fotografía entregada por el proveedor

    string email = 6;                        // Correo electrónico principal
    optional Identifier identifier = 7;      // Documento de identidad opcional en registro inicial
    string given_name = 9;                   // Nombres de pila (FHIR: HumanName.given)
    optional string family_name = 10;        // Primer apellido (FHIR: HumanName.family)
    optional string second_family_name = 11; // Segundo apellido (Extensión hispana)
    string phone = 12;                       // Teléfono de contacto
    string address = 13;                     // Dirección domiciliaria
    string birth_date = 14;                  // Fecha de nacimiento (Formato YYYY-MM-DD)
    optional string display_name = 15;       // Nombre de visualización personalizado
    // DEPRECADO: la creación de clínica es ahora `ClinicApi.CreateClinic`, una operación
    // independiente del alta. Este campo sigue vivo mientras el worker de `administration`
    // lo consuma desde `UserCreatedEvent`; retirarlo depende de decidir el destino de esa
    // tubería de eventos.
    bool create_clinic = 16 [deprecated = true];
    optional bool confirm_pending_presencial_link = 17; // Confirma explícitamente la creación de la cuenta dejando la vinculación en estado pendiente presencial
    SignUpIntent intent = 18;                           // Intención declarada por el usuario durante el registro preliminar
}

/// Intención inicial declarada por el usuario durante el registro inicial (perfilado progresivo).
enum SignUpIntent {
    INTENT_UNSPECIFIED = 0;
    INTENT_CLINIC_OWNER = 1;
    INTENT_PRACTITIONER = 2;
    INTENT_PATIENT = 3;
    INTENT_RECEPTIONIST = 4; // Recepción de una clínica existente: no crea clínicas
}

/// Estado del resultado del registro de usuario.
enum SignUpStatus {
    SIGN_UP_STATUS_UNSPECIFIED = 0;
    /// Registro completado y verificado exitosamente.
    SUCCESS = 1;
    /// Registro completado. Se detectó un historial previo con el DNI; la vinculación quedó en estado pendiente de verificación presencial.
    LINK_PENDING_PRESENCIAL_VERIFICATION = 2;
}

/// Respuesta al registro de usuario.
message SignUpResponse {
    SignUpStatus status = 1;      // Estado contextual de la operación de registro
    string message = 2;            // Mensaje legible para la interfaz de usuario (UI)
    optional string user_id = 3;   // UUID v7 de la cuenta de usuario creada
    optional PersonLink link = 4;  // Enlace generado con su nivel de certeza (AssuranceLevel)
    optional string organization_id = 5; // UUID v7 de la organización/clínica pre-asignada (cuando intent = INTENT_CLINIC_OWNER)
    optional SessionTokens session = 6;   // Sesión abierta para la cuenta recién creada
}

/// Solicitud de autenticación de usuario (Sign In).
message SignInRequest {
    string id_token = 1;     // Token JWT del proveedor de identidad
    string provider_id = 2;  // Identificador del proveedor de autenticación (ej. "google.com")
}

/// Respuesta a la autenticación de usuario.
message SignInResponse {
    string user_id = 1;               // UUID v7 del usuario en la plataforma
    string email = 2;                 // Correo electrónico principal
    string given_name = 3;            // Nombres de pila
    optional string family_name = 4;  // Primer apellido
    bool is_owner = 5;                // Indica si es propietario/administrador de clínica
    optional string phone = 6;        // Teléfono de contacto
    repeated ProfileField missing_fields = 7; // Datos obligatorios que faltan en la cuenta
    optional string second_family_name = 8;   // Segundo apellido
    optional string birth_date = 9;           // Fecha de nacimiento (Formato YYYY-MM-DD)
    optional string address = 10;             // Dirección domiciliaria
    optional Identifier identifier = 11;      // Documento de identidad
    optional SessionTokens session = 12;      // Sesión emitida por el backend (solo en SignIn)
    Role preferred_role = 13;                 // Rol preferido: orienta la interfaz, no autoriza
    Sex sex = 14;                             // Sexo registrado
    optional string professional_body = 15;   // Colegio profesional (CMP, COP, CEP, CPsP…)
    optional string license_number = 16;      // Número de colegiatura
    optional string specialty = 17;           // Especialidad
    optional string rne = 18;                 // Registro Nacional de Especialista
    bool document_verified = 19;              // El documento fue verificado (no editable)
    bool license_verified = 20;               // La colegiatura fue confirmada (no editable)
}

/// Dato obligatorio del perfil de un usuario.
enum ProfileField {
    PROFILE_FIELD_UNSPECIFIED = 0;
    PROFILE_FIELD_GIVEN_NAME = 1;
    PROFILE_FIELD_PHONE = 2;
    PROFILE_FIELD_BIRTH_DATE = 3;
    PROFILE_FIELD_FAMILY_NAME = 4;
    PROFILE_FIELD_DOCUMENT = 5;
    PROFILE_FIELD_SEX = 6;
    PROFILE_FIELD_ADDRESS = 7;
    PROFILE_FIELD_PROFESSIONAL_LICENSE = 8;   // Colegio profesional y número de colegiatura
    PROFILE_FIELD_SPECIALTY = 9;              // Especialidad y RNE
    PROFILE_FIELD_CLINIC_TAX_ID = 10;         // RUC de la clínica
    PROFILE_FIELD_CLINIC_LEGAL_NAME = 11;     // Razón social de la clínica
    PROFILE_FIELD_IPRESS_CODE = 12;           // Código IPRESS (RENIPRESS)
    PROFILE_FIELD_SECOND_FAMILY_NAME = 13;
    PROFILE_FIELD_EMAIL = 14;
    PROFILE_FIELD_LICENSE_CONFIRMED = 15;     // Colegiatura confirmada por la clínica (no se llena)
    PROFILE_FIELD_CLINIC_TRADE_NAME = 16;     // Nombre comercial de la clínica
}

/// Rol preferido de la cuenta. Solo orienta la interfaz; los permisos salen de las membresías.
enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_PATIENT = 1;
    ROLE_PRACTITIONER = 2;
    ROLE_CLINIC_OWNER = 3;
    ROLE_RECEPTIONIST = 4;
}

/// Sexo registrado (FHIR AdministrativeGender).
enum Sex {
    SEX_UNSPECIFIED = 0;
    SEX_FEMALE = 1;
    SEX_MALE = 2;
    SEX_OTHER = 3;
}

/// Acción protegida. Cada una exige un rol, una membresía, unos datos y un estado de clínica.
enum ProtectedAction {
    ACTION_UNSPECIFIED = 0;
    ACTION_CONFIRM_APPOINTMENT = 1;
    ACTION_JOIN_CLINIC = 2;
    ACTION_ACTIVATE_PRACTITIONER = 3;
    ACTION_SEARCH_PATIENTS = 4;
    ACTION_VIEW_PATIENT = 5;
    ACTION_RECORD_ENCOUNTER = 6;
    ACTION_CREATE_CLINIC = 7;
    ACTION_CONFIGURE_CLINIC = 8;
    ACTION_INVITE_STAFF = 9;
    ACTION_ACTIVATE_CLINIC = 10;
    ACTION_OPEN_FIRST_ENCOUNTER = 11;
    ACTION_ISSUE_PRESCRIPTION = 12;
    ACTION_SUSPEND_MEMBER = 13;
    ACTION_CONFIRM_LICENSE = 14;
    ACTION_REGISTER_PATIENT = 15;
    ACTION_REQUEST_MEMBERSHIP = 16;
    ACTION_APPROVE_MEMBER = 17;
    ACTION_MANAGE_SCHEDULE = 18;
    ACTION_VIEW_CLINIC_AGENDA = 19;
    ACTION_BOOK_FOR_PATIENT = 20;
    ACTION_MANAGE_APPOINTMENT = 21;
    ACTION_CHECK_IN = 22;
    ACTION_LINK_PATIENT_ACCOUNT = 23;
    ACTION_UNLINK_PATIENT_ACCOUNT = 24;
}

/// Detalle de un error FAILED_PRECONDITION: la acción y los datos que le faltan.
/// Viaja en `grpc-status-details-bin`.
message ActionRequirements {
    ProtectedAction action = 1;
    repeated ProfileField missing = 2;
    optional string organization_id = 3;
}

/// Tokens de sesión emitidos por el backend.
message SessionTokens {
    string access_token = 1;       // Se envía como `authorization: Bearer <token>`
    int64 access_expires_at = 2;   // Vencimiento del token de acceso (segundos Unix)
    string refresh_token = 3;      // Se canjea en `RefreshSession`
}

message RefreshSessionRequest {
    string refresh_token = 1;
}

message GetProfileRequirementsRequest {}

/// Requisito de un dato del perfil para el usuario de la sesión.
message FieldRequirement {
    ProfileField field = 1;
    repeated ProtectedAction required_for = 2; // Acciones que lo vuelven obligatorio (vacío: siempre opcional)
    bool missing = 3;                          // El usuario aún no lo registró
    bool read_only = 4;                        // Verificado o proveniente del proveedor de identidad
    repeated Role roles = 5;                   // Roles del usuario a los que aplica
}

message ProfileRequirements {
    repeated FieldRequirement fields = 1;
    repeated Membership memberships = 2;
    Role preferred_role = 3;
    repeated ProfileField missing_for_habitual = 4; // Lo que falta para las acciones habituales del rol
    SignInResponse account = 5;                     // Valores actuales de la cuenta (sin sesión)
}

enum MembershipRole {
    MEMBERSHIP_ROLE_UNSPECIFIED = 0;
    MEMBERSHIP_ROLE_OWNER = 1;
    MEMBERSHIP_ROLE_ADMIN = 2;
    MEMBERSHIP_ROLE_PRACTITIONER = 3;
    MEMBERSHIP_ROLE_RECEPTIONIST = 4;
}

enum MembershipStatus {
    MEMBERSHIP_STATUS_UNSPECIFIED = 0;
    MEMBERSHIP_STATUS_INVITED = 1;
    MEMBERSHIP_STATUS_PENDING = 2;
    MEMBERSHIP_STATUS_ACTIVE = 3;
    MEMBERSHIP_STATUS_SUSPENDED = 4;
    MEMBERSHIP_STATUS_REQUESTED = 5; // Pidió entrar; espera que el dueño o un administrador apruebe
}

enum ClinicStatus {
    CLINIC_STATUS_UNSPECIFIED = 0;
    CLINIC_STATUS_PENDING_SETUP = 1;
    CLINIC_STATUS_ACTIVE = 2;
    CLINIC_STATUS_SUSPENDED = 3;
}

/// Relación de un usuario con una clínica.
message Membership {
    string id = 1;
    string organization_id = 2;
    string organization_name = 3;
    ClinicStatus organization_status = 4;
    string user_id = 5;
    MembershipRole role = 6;
    MembershipStatus status = 7;
    bool license_confirmed = 8;
    string organization_subdomain = 9; // Enlace de la clínica (`/c/<subdominio>`)
}

message RequestMembershipRequest {
    string subdomain = 1;    // Enlace de la clínica, p. ej. "san-borja"
    MembershipRole role = 2; // PRACTITIONER o RECEPTIONIST
}

/// Una persona del personal de la clínica.
message ClinicMember {
    Membership membership = 1;
    string display_name = 2;
    string email = 3;
}

message ClinicMembers {
    repeated ClinicMember members = 1;
}

message MembershipIdRequest {
    string membership_id = 1;
}

message ClinicIdRequest {
    string organization_id = 1;
}

message InviteMemberRequest {
    string organization_id = 1;
    string email = 2;
    MembershipRole role = 3;
}

message UpdateClinicSetupRequest {
    string organization_id = 1;
    optional string tax_id = 2;      // RUC (11 dígitos, módulo 11)
    optional string legal_name = 3;  // Razón social
    optional string trade_name = 4;  // Nombre comercial
    optional string ipress_code = 5; // Código IPRESS
}

message ClinicSummary {
    string organization_id = 1;
    string name = 2;
    ClinicStatus status = 3;
    optional string tax_id = 4;
    optional string legal_name = 5;
    optional string trade_name = 6;
    optional string ipress_code = 7;
}

/// Solicitud para completar los datos de la cuenta. Un dato opcional omitido conserva su valor.
message CompleteProfileRequest {
    // DEPRECADO: la cuenta sale de la sesión (`authorization: Bearer`). Se ignora.
    string id_token = 1 [deprecated = true];
    string given_name = 2;           // Nombres de pila (vacío: conserva el valor)
    optional string family_name = 3; // Primer apellido
    string phone = 4;                // Teléfono de contacto (vacío: conserva el valor)
    optional string second_family_name = 5; // Segundo apellido
    string birth_date = 6;                  // Fecha de nacimiento YYYY-MM-DD (vacío: conserva el valor)
    optional string address = 7;            // Dirección domiciliaria
    optional Identifier identifier = 8;     // Documento de identidad
    Sex sex = 9;                            // SEX_UNSPECIFIED conserva el valor
    optional string professional_body = 10; // Colegio profesional
    optional string license_number = 11;    // Número de colegiatura
    optional string specialty = 12;         // Especialidad
    optional string rne = 13;               // Registro Nacional de Especialista
    Role preferred_role = 14;               // ROLE_UNSPECIFIED conserva el valor
}


// ============================================================================
// TIPOS DE DATOS CLAVE (DATA TYPES - HL7 FHIR R4)
// ============================================================================

/// Representa el nombre de una persona según la especificación HL7 FHIR R4.
/// Ref: https://hl7.org/fhir/R4/datatypes.html#HumanName
message HumanName {
    string use = 1;             // Propósito del nombre (ej. "official", "usual")
    repeated string family = 2; // Apellidos (family names)
    repeated string given = 3;  // Nombres de pila (given names)
}

/// Representa un punto de contacto (teléfono, email, etc.) según HL7 FHIR R4.
/// Ref: https://hl7.org/fhir/R4/datatypes.html#ContactPoint
message ContactPoint {
    /// Sistema de telecomunicación utilizado
    enum System {
        SYSTEM_UNSPECIFIED = 0;
        PHONE = 1;
        FAX = 2;
        EMAIL = 3;
        SMS = 4;
        URL = 5;
    }

    /// Contexto o propósito del contacto
    enum Use {
        USE_UNSPECIFIED = 0;
        HOME = 1;
        WORK = 2;
        MOBILE = 3;
        TEMP = 4;
        OLD = 5;
    }

    System system = 1; // Canal de contacto
    string value = 2;  // Valor del contacto (ej. "usuario@dominio.com" o "+51999888777")
    Use use = 3;       // Contexto de uso
}

/// Representa un archivo adjunto o medio multimedia según HL7 FHIR R4.
/// Ref: https://hl7.org/fhir/R4/datatypes.html#Attachment
message Attachment {
    string content_type = 1; // Tipo MIME (ej. "image/jpeg", "image/png")
    string url = 2;          // URL accesible del recurso
    bytes data = 3;          // Contenido binario directo (opcional)
    string title = 4;        // Título o descripción del recurso
    string creation = 5;     // Fecha de creación (Formato ISO-8601)
}


// ============================================================================
// RECURSOS PRINCIPALES (FHIR RESOURCES: PERSON & PATIENT)
// ============================================================================

/// Representa una vinculación FHIR (Person.link) entre la identidad de la persona
/// y recursos de pacientes, profesionales de salud u organizaciones.
/// Ref: https://hl7.org/fhir/R4/person-definitions.html#Person.link
message PersonLink {
    /// Nivel de certeza o verificación de la vinculación (FHIR: Person.link.assurance)
    enum AssuranceLevel {
        ASSURANCE_UNSPECIFIED = 0;
        LEVEL_1 = 1; // Certeza muy baja (declarativa)
        LEVEL_2 = 2; // Certeza baja
        LEVEL_3 = 3; // Certeza alta (verificada)
        LEVEL_4 = 4; // Certeza oficial / absoluta (documentada y verificada)
    }

    /// Recurso de destino al que se enlaza esta identidad
    oneof target {
        string patient_id = 1;        // ID del recurso Patient vinculado (propio o familiar)
        string practitioner_id = 2;   // ID del recurso Practitioner (médico / profesional)
        string related_person_id = 3; // ID del recurso RelatedPerson (tutor / familiar)
        string organization_id = 4;   // ID del recurso Organization (clínica)
    }

    AssuranceLevel assurance = 5;     // Nivel de certeza del enlace
}

/// Recurso Persona (Identidad de Usuario) según la especificación HL7 FHIR R4.
/// Ref: https://hl7.org/fhir/R4/person.html
message Person {
    string id = 1;                      // UUID v7 de la persona / usuario
    bool active = 2;                    // Estado activo/inactivo de la cuenta
    repeated Identifier identifier = 3; // Documentos oficiales (ej. DNI)
    repeated HumanName name = 4;        // Nombres de la persona
    repeated ContactPoint telecom = 5;  // Vías de contacto (email, teléfono)
    
    enum Gender {
        GENDER_UNSPECIFIED = 0;
        MALE = 1;
        FEMALE = 2;
        OTHER = 3;
        UNKNOWN = 4;
    }
    Gender gender = 6;                  // Género administrativo
    string birth_date = 7;             // Fecha de nacimiento (Formato YYYY-MM-DD)
    repeated Attachment photo = 8;      // Fotografía o avatar de la persona
    repeated PersonLink link = 9;       // Lista de enlaces a recursos Patient, Practitioner, etc.
}

/// Recurso Paciente según la especificación HL7 FHIR R4.
/// Ref: https://hl7.org/fhir/R4/patient.html
message Patient {
    string id = 1;                      // UUID v7 único del paciente

    // 1. Identificación y Estado
    repeated Identifier identifier = 2; // Documentos e identificadores asociados
    bool active = 3;                    // Estado activo/inactivo del registro del paciente

    // 2. Datos Demográficos
    repeated HumanName name = 4;        // Nombres del paciente (legal, usual, etc.)
    repeated ContactPoint telecom = 5;  // Vías de contacto (teléfono, email)

    /// Género administrativo según FHIR
    enum Gender {
        GENDER_UNSPECIFIED = 0;
        MALE = 1;
        FEMALE = 2;
        OTHER = 3;
        UNKNOWN = 4;
    }

    Gender gender = 6;                  // Género del paciente
    string birth_date = 7;             // Fecha de nacimiento (Formato YYYY-MM-DD)

    // 3. Estado de fallecimiento
    oneof deceased_status {
        bool is_deceased_boolean = 8;   // Indica si el paciente ha fallecido
        string deceased_date_time = 9;  // Fecha y hora del fallecimiento (ISO-8601)
    }

    // 4. Organización y Custodia
    string managing_organization_reference = 10; // Referencia a la clínica u organización custodia

    // 5. Fotografía o Imagen de Perfil
    repeated Attachment photo = 11;     // Fotografía o avatar del paciente
}



// ============================================================================
// MENSAJES DE CLÍNICA (ORGANIZATION)
// ============================================================================

/// Solicitud de creación de una clínica.
///
/// Lleva la demografía del propietario porque el contexto de administración
/// **no consulta** al contexto de identidad: construye su propia réplica local
/// del profesional a partir de lo que recibe, conservando la autonomía operativa
/// de cada clínica.
message CreateClinicRequest {
    string owner_user_id = 1;                  // UUID v7 del usuario que crea la clínica
    string name = 2;                           // Razón social o nombre comercial
    optional string tax_id = 3;                // RUC o identificador fiscal

    // Demografía del propietario, para su ficha de profesional en esta clínica
    string given_name = 4;                     // Nombres de pila (FHIR: HumanName.given)
    optional string family_name = 5;           // Primer apellido
    optional string second_family_name = 6;    // Segundo apellido (extensión hispana)
    optional string email = 7;                 // Correo electrónico de contacto
    optional string phone = 8;                 // Teléfono de contacto
    optional string medical_license_number = 9; // Colegiatura CMP/COP, si ya se conoce
    string subdomain = 10;                     // Subdominio exclusivo de la clínica (ej. "san-borja")
    optional string network_id = 11 [deprecated = true]; // Ignorado: la clínica cuelga siempre de la Organization raíz de su dueño
}

/// Respuesta a la creación de una clínica.
message CreateClinicResponse {
    string organization_id = 1;   // UUID v7 de la clínica creada
    string network_id = 2;        // UUID v7 de la red clínica
    string practitioner_id = 3;   // UUID v7 de la ficha de profesional del propietario
    bool already_existed = 4;     // La clínica ya existía y se devolvió sin recrearla
}


// ============================================================================
// AGENDA Y CITAS
// ============================================================================

message ClinicLinkRequest {
    string subdomain = 1;
}

message PublicClinic {
    string organization_id = 1;
    string name = 2;
    ClinicStatus status = 3;
    string timezone = 4;
    optional string address = 5;
}

message PublicPractitioner {
    string user_id = 1;
    string name = 2;
    optional string specialty = 3;
}

message PublicPractitioners {
    repeated PublicPractitioner practitioners = 1;
}

message AvailabilityRequest {
    string subdomain = 1;
    string practitioner_user_id = 2;
    string from = 3;
    string to = 4;
}

message SlotInfo {
    string id = 1;
    string start = 2;
    string end = 3;
}

message Availability {
    repeated SlotInfo slots = 1;
}

message TimeBlockInfo {
    int32 weekday = 1; // 1 = lunes … 7 = domingo
    string start = 2;  // HH:MM local
    string end = 3;    // HH:MM local
}

message SetWeeklyScheduleRequest {
    string organization_id = 1;
    int32 slot_minutes = 2;
    repeated TimeBlockInfo blocks = 3;
}

message ScheduleExceptionInfo {
    string id = 1;
    string start = 2;
    string end = 3;
    optional string reason = 4;
}

message ScheduleResponse {
    bool defined = 1;
    int32 slot_minutes = 2;
    repeated TimeBlockInfo blocks = 3;
    repeated ScheduleExceptionInfo exceptions = 4;
    string timezone = 5;
}

message AddScheduleExceptionRequest {
    string organization_id = 1;
    string start = 2;
    string end = 3;
    optional string reason = 4;
}

message RemoveScheduleExceptionRequest {
    string organization_id = 1;
    string exception_id = 2;
}

message BookAppointmentRequest {
    string organization_id = 1;
    string practitioner_user_id = 2;
    string start = 3;
}

message NewPatientInfo {
    string given_name = 1;
    string family_name = 2;
    optional string second_family_name = 3;
    Identifier identifier = 4;
    string phone = 5;
    optional string birth_date = 6;
}

message BookForPatientRequest {
    string organization_id = 1;
    string practitioner_user_id = 2;
    string start = 3;
    oneof patient {
        string patient_id = 4;
        NewPatientInfo new_patient = 5;
    }
}

enum AppointmentStatus {
    APPOINTMENT_STATUS_UNSPECIFIED = 0;
    APPOINTMENT_STATUS_BOOKED = 1;
    APPOINTMENT_STATUS_ARRIVED = 2;
    APPOINTMENT_STATUS_CANCELLED = 3;
    APPOINTMENT_STATUS_NOSHOW = 4;
}

enum DocumentCheck {
    DOCUMENT_CHECK_UNSPECIFIED = 0;
    DOCUMENT_CHECK_MATCH = 1;
    DOCUMENT_CHECK_MISMATCH = 2;
}

message AppointmentInfo {
    string id = 1;
    string organization_id = 2;
    string clinic_name = 3;
    string clinic_subdomain = 4;
    string practitioner_user_id = 5;
    string practitioner_name = 6;
    string patient_id = 7;
    optional string patient_name = 8;
    string start = 9;
    string end = 10;
    AppointmentStatus status = 11;
    DocumentCheck document_check = 12;
}

message AppointmentList {
    repeated AppointmentInfo appointments = 1;
}

message ListMyAppointmentsRequest {}

message ListClinicAppointmentsRequest {
    string organization_id = 1;
    string from = 2;
    string to = 3;
}

message AppointmentIdRequest {
    string appointment_id = 1;
}

message RescheduleAppointmentRequest {
    string appointment_id = 1;
    string practitioner_user_id = 2;
    string start = 3;
}

message CheckInRequest {
    string appointment_id = 1;
    DocumentCheck document_check = 2;
}

message LinkSuggestionInfo {
    string user_id = 1;
    string name = 2;
    string email = 3;
}

message CheckInResponse {
    AppointmentInfo appointment = 1;
    bool account_verified = 2;
    repeated LinkSuggestionInfo link_suggestions = 3;
}

message PatientLinkRequest {
    string organization_id = 1;
    string patient_id = 2;
}

message LinkSuggestions {
    repeated LinkSuggestionInfo suggestions = 1;
}

message LinkPatientAccountRequest {
    string organization_id = 1;
    string patient_id = 2;
    string user_id = 3;
    bool document_seen = 4;
}

message PatientLinkResponse {
    string link_id = 1;
}

message UnlinkPatientAccountRequest {
    string organization_id = 1;
    string link_id = 2;
    string reason = 3;
}
