[package]
name = "medical_front"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["yew", "trunk"]
categories = ["gui", "wasm", "web-programming"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
async-std = "1.12.0"
console_error_panic_hook = "0.1.7"
console_log = { version = "1.0.0", features = ["color"] }
derive_builder = "0.20.0"
display_json = "0.2.1"
#gloo-storage = "0.2.2"
leptos = { version = "0.6.13", features = ["csr", "nightly", "serde"] }
#leptos_meta = { version = "0.4.8", features = ["csr", "nightly"] }
leptos_router = { version = "0.6.13", features = ["csr", "nightly"] }
log = "0.4.22"
parse-display = "0.9.1"
prost = "0.13.1"
serde = "1.0.204"
serde_json = "1.0.121"
serde_qs = "0.13.0"
tonic = { version = "0.12.1", features = ["prost", "codegen"], default-features = false }
tonic-web-wasm-client = "0.6.0"
ulid = "1.1.3"
wasm-bindgen = "0.2.92"
#wasm-logger = "0.2.0"
web-sys = { version = "0.3.69", features = ["css", "CssStyleDeclaration"] }
rand = "0.8.5"

[build-dependencies]
tonic-build = { version = "0.12.1", features = ["prost"], default-features = false }
