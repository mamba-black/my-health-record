 [package]
name = "medical_front"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["yew", "trunk"]
categories = ["gui", "wasm", "web-programming"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
async-std = "1.13.0"
console_error_panic_hook = "0.1.7"
console_log = { version = "1.0.0", features = ["color"] }
derive_builder = "0.20.2"
display_json = "0.2.1"
#gloo-storage = "0.2.2"
leptos = { version = "0.7.0-rc2", features = ["csr", "nightly"] }
#leptos_meta = { version = "0.4.8", features = ["csr", "nightly"] }
leptos_router = { version = "0.7.0-rc2", features = ["nightly"] }
log = "0.4.22"
parse-display = "0.10.0"
prost = "0.13.3"
serde = "1.0.215"
serde_json = "1.0.124"
serde_qs = "0.13.0"
tonic = { version = "0.12.3", features = ["prost", "codegen"], default-features = false }
tonic-web-wasm-client = "0.6.0"
ulid = "1.1.3"
wasm-bindgen = "0.2.95"
#wasm-logger = "0.2.0"
web-sys = { version = "0.3.72", features = ["css", "CssStyleDeclaration"] }
rand = "0.8.5"
chrono = { version = "0.4.38", features = ["serde", "unstable-locales"] }
chrono-tz = "0.10.0"
timeago = "0.4.2"

[build-dependencies]
tonic-build = { version = "0.12.3", features = ["prost"], default-features = false }
