[workspace]
resolver = "2"
members = ["clickcare",
    "clinic",
    "clinic_admin",
    "patient"
]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Hector Miuler Malpica Gallegos <miuler@gmail.com>"]

[workspace.dependencies]
chrono = "0.4.38"
serde_json = "1.0.124"
ulid = "1.2.1"
uuidv7 = "0.1.7"
uuid = { version = "1.19.0", features = ["v4", "v7"] }

## =============================
## Dependencies for gRPC server
axum = "0.8.7"
tokio = { version = "1.39.2", features = ["tokio-macros", "rt-multi-thread"] }
tonic = { version = "0.14.2" }
tonic-reflection = "0.14.2"
tonic-web = "0.14.2"
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"
prost = "0.14.1"
prost-types = "0.14.1"

## =============================
## Observability
log = "0.4.22"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

## =============================
## Test
fake = { version = "4.4.0", features = ["chrono"] }
